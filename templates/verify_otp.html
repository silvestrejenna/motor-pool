<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Verify OTP</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/verify_otp.css') }}"
    />
  </head>

  <body>
    <div class="card">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
      </div>
      <h2>Email Verification</h2>
      <p>Enter the 6-digit code sent to your email</p>

      <form method="POST">
        <div class="otp-container">
          <input type="text" maxlength="1" name="d1" required />
          <input type="text" maxlength="1" name="d2" required />
          <input type="text" maxlength="1" name="d3" required />
          <input type="text" maxlength="1" name="d4" required />
          <input type="text" maxlength="1" name="d5" required />
          <input type="text" maxlength="1" name="d6" required />
        </div>

        <input type="hidden" name="otp" id="otp" />

        <button type="submit">Verify Code</button>
      </form>

      <div class="resend">
        Didn't receive the code?
        <a href="{{ url_for('resend_otp') }}">Resend</a>
      </div>
    </div>

    <script>
      const inputs = document.querySelectorAll(".otp-container input");
      const hiddenInput = document.getElementById("otp");

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          updateOTP();
        });
      });

      function updateOTP() {
        let otp = "";

        inputs.forEach((i) => {
          otp += i.value;
        });

        hiddenInput.value = otp;
      }
    </script>
  </body>
</html>
